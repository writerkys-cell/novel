<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모함</title>
<meta name="description" content="폰에 글과 사진을 모아 두었다가 집에서 맥으로 보내는 메모함">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-360.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="메모함">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)">
<style>
  :root { --bg:#f6f3ec; --card:#fffdf8; --ink:#22211d; --muted:#6f6a5e; --line:#e2dcd0; --accent:#2f6f5e; --accent-ink:#fff; --warn:#a3582a; --ok:#2f6f5e; --chip:#ece7db; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1b18; --card:#262522; --ink:#ece8df; --muted:#a39d8f; --line:#3a3833; --accent:#7fc1ac; --accent-ink:#10201b; --warn:#e0a070; --ok:#7fc1ac; --chip:#33312c; } }
  :root[data-theme="dark"] { --bg:#1c1b18; --card:#262522; --ink:#ece8df; --muted:#a39d8f; --line:#3a3833; --accent:#7fc1ac; --accent-ink:#10201b; --warn:#e0a070; --ok:#7fc1ac; --chip:#33312c; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  main { max-width:640px; margin:0 auto; display:grid; gap:12px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { font-size:21px; margin:0; }
  #status { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #status i { width:8px; height:8px; border-radius:50%; background:var(--line); display:inline-block; }
  #status.on i { background:var(--ok); } #status.off i { background:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 4px; }
  select, input[type=text], input[type=url], textarea { width:100%; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
  textarea { min-height:160px; resize:vertical; line-height:1.6; }
  select:focus, input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .field { margin-bottom:10px; } .field:last-child { margin-bottom:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { font:inherit; font-weight:600; border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:10px; padding:10px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn.danger { color:var(--warn); }
  .btn.small { padding:6px 10px; font-size:14px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .grow { flex:1; }
  input[type=file] { display:none; }
  #thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  #thumbs figure { margin:0; position:relative; width:72px; height:72px; }
  #thumbs img, #thumbs .raw { width:72px; height:72px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); background:var(--chip); }
  #thumbs button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:none; background:var(--ink); color:var(--bg); font-size:14px; line-height:22px; padding:0; }
  .hint { font-size:13px; color:var(--muted); margin:6px 0 0; }
  #listHead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
  #listHead b { font-size:15px; }
  ul#list { list-style:none; margin:0; padding:0; }
  #list li { padding:10px 2px; border-top:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:2px 10px; }
  #list li:first-child { border-top:none; }
  #list .t { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list .s { grid-column:1 / -1; font-size:14px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list .d { font-size:13px; color:var(--muted); white-space:nowrap; }
  #list .tag { font-size:12px; color:var(--accent); margin-left:6px; }
  #empty { color:var(--muted); font-size:14px; padding:6px 2px; }
  #settings { display:none; }
  #settings.show { display:block; }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; } dt { color:var(--muted); } dd { margin:0; }
  code { font:14px ui-monospace,Menlo,monospace; word-break:break-all; }
  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:15px; opacity:0; transition:.25s; pointer-events:none; max-width:90vw; text-align:center; z-index:9; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>메모함</h1>
    <div class="row" style="gap:10px">
      <span id="status"><i></i><span>확인 중…</span></span>
      <button class="btn small" id="btnSettings" type="button" aria-label="설정">⚙︎</button>
    </div>
  </header>

  <section class="card" id="settings">
    <div class="field">
      <label for="macUrl">맥 주소 (같은 와이파이에서 보낼 때 쓰는 곳)</label>
      <input type="url" id="macUrl" placeholder="https://gim-yeonsuui-MacBookAir.local:8791" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="row">
      <button class="btn" id="btnTest" type="button">연결 확인</button>
      <button class="btn" id="btnTags" type="button">꼬리표 다시 받기</button>
      <span class="hint grow" id="testOut"></span>
    </div>
    <p class="hint">맥 주소는 https 여야 합니다(이 페이지가 https 라서). 인증서는 전에 설치한 것을 그대로 씁니다. <code>.local</code> 주소가 안 잡히면 <code>https://192.168.0.6:8791</code> 처럼 숫자 주소로.</p>
    <dl style="margin-top:8px">
      <dt>이 앱</dt><dd><code id="appOrigin"></code></dd>
      <dt>저장소</dt><dd id="storageInfo">…</dd>
    </dl>
  </section>

  <section class="card">
    <div class="field">
      <label for="tag">꼬리표 (어느 프로젝트 것인지 알 때만)</label>
      <select id="tag"><option value="">고르지 않음 (클로드가 분류)</option></select>
    </div>
    <div class="field">
      <label for="title">제목 (비우면 첫 줄)</label>
      <input type="text" id="title" placeholder="제목" autocomplete="off">
    </div>
    <div class="field">
      <label for="text">메모</label>
      <textarea id="text" placeholder="생각난 것을 적으세요"></textarea>
    </div>
    <div class="row">
      <button class="btn" id="btnCamera" type="button">📷 촬영</button>
      <button class="btn" id="btnPick" type="button">🖼 사진 고르기</button>
      <input type="file" id="fileCamera" accept="image/*" capture="environment">
      <input type="file" id="filePick" accept="image/*" multiple>
    </div>
    <div id="thumbs"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary grow" id="btnSave" type="button">폰에 저장</button>
      <button class="btn" id="btnCancel" type="button" style="display:none">취소</button>
      <button class="btn danger" id="btnDelete" type="button" style="display:none">지우기</button>
    </div>
  </section>

  <section class="card">
    <div id="listHead">
      <b id="count">폰에 있는 메모 0개</b>
      <span class="hint" style="margin:0" id="sizeInfo"></span>
    </div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn primary grow" id="btnSend" type="button">맥으로 보내기</button>
      <button class="btn" id="btnExport" type="button">파일로 내보내기</button>
    </div>
    <ul id="list"></ul>
    <div id="empty">아직 없습니다. 위에 적고 "폰에 저장"을 누르세요.</div>
    <p class="hint">보내기 전까지 메모는 이 폰에만 있습니다. 집에 오면 "맥으로 보내기"를 눌러 인박스로 옮기세요. 보낸 것은 폰에서 지워집니다.</p>
  </section>
</main>
<div id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DEFAULT_MAC = 'https://gim-yeonsuui-MacBookAir.local:8791';
  const DEVICE = /iPhone|iPad/.test(navigator.userAgent) ? '아이폰' : (/Mac/.test(navigator.userAgent) ? '맥' : '기타');
  const safe = (fn) => (...a) => { try { return fn(...a); } catch (e) { return undefined; } };
  const remember = safe((k, v) => localStorage.setItem(k, v)), recall = safe((k) => localStorage.getItem(k));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tagEl = $('tag'), titleEl = $('title'), textEl = $('text'), thumbs = $('thumbs'), statusEl = $('status');
  const btnSave = $('btnSave'), btnCancel = $('btnCancel'), btnDelete = $('btnDelete'), btnSend = $('btnSend'), btnExport = $('btnExport');
  let photos = [];      // {name, type, data(dataURL), raw?}
  let editing = null;   // 고치는 중인 메모
  let online = false;
  let macUrl = (recall('macUrl') || DEFAULT_MAC).replace(/\/+$/, '');
  let toastTimer;
  const say = (m, ms = 2400) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); };

  // ---------- 폰 안의 저장소 (IndexedDB) ----------
  const db = new Promise((res, rej) => {
    const r = indexedDB.open('memobox-phone', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('memos', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const d = await db; return new Promise((res, rej) => { const t = d.transaction('memos', mode); const s = t.objectStore('memos'); const q = fn(s); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const allMemos = async () => (await tx('readonly', (s) => s.getAll())).sort((a, b) => a.created < b.created ? -1 : 1);
  const putMemo = (m) => tx('readwrite', (s) => s.put(m));
  const delMemo = (id) => tx('readwrite', (s) => s.delete(id));

  // ---------- 맥 연결 ----------
  const withTimeout = (ms) => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
  let pingSeq = 0;
  async function ping() {
    const seq = ++pingSeq; let ok = false;
    try {
      const r = await fetch(macUrl + '/api/ping', { cache: 'no-store', signal: withTimeout(3500) });
      ok = r.ok;
    } catch (e) { ok = false; }
    if (seq !== pingSeq) return online; // 그 사이 주소가 바뀌어 새 확인이 나갔으면 옛 결과는 버린다
    online = ok;
    statusEl.className = online ? 'on' : 'off';
    statusEl.lastElementChild.textContent = online ? '맥에 닿음' : '맥에 닿지 않음 · 폰에만 저장';
    return online;
  }
  async function loadTags(force) {
    const fill = (names) => { const cur = tagEl.value; tagEl.innerHTML = '<option value="">고르지 않음 (클로드가 분류)</option>' + names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join(''); tagEl.value = cur; };
    const cached = recall('tags'); fill(cached ? JSON.parse(cached) : []);
    if (!online && !force) return;
    try {
      const r = await fetch(macUrl + '/api/projects', { cache: 'no-store', signal: withTimeout(3500) }); const j = await r.json();
      if (j.ok) { remember('tags', JSON.stringify(j.projects)); fill(j.projects); if (force) say('꼬리표를 받았습니다'); }
    } catch (e) { if (force) say('맥에 닿지 않아 받지 못했습니다'); }
  }

  // ---------- 사진 ----------
  function shrink(file, max = 2400, q = 0.85) {
    return new Promise((res, rej) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res({ name: file.name || 'photo.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', q) });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했습니다')); };
      img.src = url;
    });
  }
  const asDataURL = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
  function renderThumbs() {
    thumbs.innerHTML = photos.map((p, i) => `<figure>${p.raw ? `<div class="raw">${esc((p.type.split('/')[1] || '사진').toUpperCase())}</div>` : `<img src="${p.data}" alt="">`}<button type="button" data-i="${i}" aria-label="사진 빼기">×</button></figure>`).join('');
  }
  thumbs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; photos.splice(+b.dataset.i, 1); renderThumbs(); });
  async function addFiles(list) {
    for (const f of list) {
      try { photos.push(await shrink(f)); }
      catch (err) {
        try { photos.push({ name: f.name || 'photo', type: f.type || 'image/heic', data: await asDataURL(f), raw: true }); say('줄이지 못해 원본 그대로 붙입니다'); }
        catch (e2) { say('사진을 읽지 못했습니다'); }
      }
    }
    renderThumbs();
  }
  $('btnCamera').onclick = () => $('fileCamera').click();
  $('btnPick').onclick = () => $('filePick').click();
  $('fileCamera').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  $('filePick').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };

  // ---------- 쓰기 · 고치기 ----------
  const draftKeys = { title: 'draftTitle', text: 'draftText' };
  function clearForm() {
    editing = null; titleEl.value = ''; textEl.value = ''; photos = []; renderThumbs();
    remember(draftKeys.title, ''); remember(draftKeys.text, '');
    btnSave.textContent = '폰에 저장'; btnCancel.style.display = 'none'; btnDelete.style.display = 'none';
  }
  function openMemo(m) {
    editing = m; tagEl.value = m.project || ''; titleEl.value = m.title || ''; textEl.value = m.text || ''; photos = (m.photos || []).slice(); renderThumbs();
    btnSave.textContent = '고친 것 저장'; btnCancel.style.display = ''; btnDelete.style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' }); textEl.focus();
  }
  btnSave.onclick = async () => {
    const title = titleEl.value.trim(), text = textEl.value.trim();
    if (!text && !title && !photos.length) return say('적은 것도 사진도 없습니다');
    btnSave.disabled = true;
    try {
      const m = editing
        ? { ...editing, project: tagEl.value, title, text, photos, edited: new Date().toISOString() }
        : { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), project: tagEl.value, title, text, photos, created: new Date().toISOString(), device: DEVICE };
      await putMemo(m);
      const was = !!editing; clearForm(); const n = await renderList();
      say(was ? '고쳤습니다' : `폰에 저장했습니다 (${n}개 모임)`);
    } catch (e) { say('저장하지 못했습니다: ' + e.message, 4000); }
    finally { btnSave.disabled = false; }
  };
  btnCancel.onclick = () => clearForm();
  btnDelete.onclick = async () => {
    if (!editing) return;
    if (!confirm('이 메모를 폰에서 지울까요? 되돌릴 수 없습니다.')) return;
    await delMemo(editing.id); clearForm(); await renderList(); say('지웠습니다');
  };
  titleEl.value = recall(draftKeys.title) || ''; textEl.value = recall(draftKeys.text) || '';
  titleEl.addEventListener('input', () => { if (!editing) remember(draftKeys.title, titleEl.value); });
  textEl.addEventListener('input', () => { if (!editing) remember(draftKeys.text, textEl.value); });

  // ---------- 목록 ----------
  const fmtDate = (iso) => { const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const firstLine = (m) => (m.title || (m.text || '').split('\n').find((l) => l.trim()) || '(사진만)').trim();
  async function renderList() {
    const items = await allMemos();
    const list = $('list');
    list.innerHTML = items.slice().reverse().map((m) => `
      <li data-id="${m.id}">
        <span class="t">${esc(firstLine(m))}${m.project ? `<span class="tag">${esc(m.project)}</span>` : ''}</span>
        <span class="d">${fmtDate(m.created)}${m.photos && m.photos.length ? ` · 📷${m.photos.length}` : ''}</span>
        ${m.title && m.text ? `<span class="s">${esc(m.text.split('\n')[0])}</span>` : ''}
      </li>`).join('');
    $('empty').style.display = items.length ? 'none' : '';
    const photosN = items.reduce((a, m) => a + (m.photos ? m.photos.length : 0), 0);
    $('count').textContent = `폰에 있는 메모 ${items.length}개`;
    $('sizeInfo').textContent = photosN ? `사진 ${photosN}장` : '';
    btnSend.disabled = btnExport.disabled = !items.length;
    list.onclick = (e) => { const li = e.target.closest('li'); if (!li) return; const m = items.find((x) => x.id === li.dataset.id); if (m) openMemo(m); };
    return items.length;
  }

  // ---------- 맥으로 보내기 ----------
  async function send(m) {
    const r = await fetch(macUrl + '/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(m), signal: withTimeout(60000) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || '저장 실패'); return j;
  }
  btnSend.onclick = async () => {
    const items = await allMemos(); if (!items.length) return;
    btnSend.disabled = true;
    try {
      if (!(await ping())) return say('맥에 닿지 않습니다. 같은 와이파이인지, 설정의 맥 주소가 맞는지 보세요.', 4000);
      let sent = 0, failed = null;
      for (const m of items) {
        btnSend.textContent = `보내는 중 ${sent + 1}/${items.length}`;
        try { await send(m); await delMemo(m.id); sent++; }
        catch (e) { failed = e; break; }
      }
      await renderList();
      if (failed) say(`${sent}개 보내고 멈췄습니다: ${failed.message}`, 5000);
      else say(`${sent}개를 맥 인박스로 보냈습니다`);
    } finally { btnSend.textContent = '맥으로 보내기'; btnSend.disabled = false; }
  };

  // ---------- 파일로 내보내기 (와이파이 없이 공유 시트로) ----------
  const slugify = (s, limit = 30) => { s = ((s || '').trim().split('\n')[0] || ''); s = s.replace(/[\\/:*?"<>|#\[\]]+/g, ' ').replace(/\s+/g, ' ').trim(); return s.slice(0, limit).replace(/^[ .,;!?]+|[ .,;!?]+$/g, '') || '메모'; };
  const extOf = (p) => ({ 'image/jpeg': '.jpg', 'image/png': '.png', 'image/heic': '.heic', 'image/heif': '.heic', 'image/webp': '.webp', 'image/gif': '.gif' }[p.type] || '.jpg');
  const dataURLtoBlob = (d, type) => { const b = atob(d.split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Blob([u], { type }); };
  function filesOf(m) {
    const d = new Date(m.created); const p = (n) => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
    const stem = `${stamp}_${slugify(m.title || m.text)}`;
    const files = [];
    const names = (m.photos || []).map((ph, i) => { const n = `${stem}_${i + 1}${extOf(ph)}`; files.push(new File([dataURLtoBlob(ph.data, ph.type)], n, { type: ph.type })); return n; });
    const lines = [`# ${m.title || slugify(m.text)}`, '', `- 작성: ${stamp.replace('_', ' ').replace(/(\d\d)(\d\d)$/, '$1:$2')}`, `- 프로젝트: ${m.project || '(미정)'}`, `- 기기: ${m.device || DEVICE}`];
    if (names.length) lines.push('- 사진: ' + names.join(', '));
    lines.push('', '---', '', m.text || '', '');
    files.unshift(new File([lines.join('\n')], `${stem}.md`, { type: 'text/markdown' }));
    return files;
  }
  btnExport.onclick = async () => {
    const items = await allMemos(); if (!items.length) return;
    const files = items.flatMap(filesOf);
    if (navigator.share && navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files, title: '메모함 내보내기' }); say('공유 시트로 넘겼습니다. 맥으로 들어간 뒤에는 여기서 지우세요.', 4000); }
      catch (e) { if (e.name !== 'AbortError') say('내보내지 못했습니다: ' + e.message, 4000); }
    } else {
      for (const f of files) { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
      say(`${files.length}개 파일을 내려받습니다`);
    }
  };

  // ---------- 설정 ----------
  $('btnSettings').onclick = () => $('settings').classList.toggle('show');
  $('macUrl').value = macUrl;
  $('macUrl').addEventListener('change', () => { macUrl = ($('macUrl').value.trim() || DEFAULT_MAC).replace(/\/+$/, ''); $('macUrl').value = macUrl; remember('macUrl', macUrl); ping(); });
  $('btnTest').onclick = async () => { $('testOut').textContent = '확인 중…'; const ok = await ping(); $('testOut').textContent = ok ? '맥에 닿습니다' : '닿지 않습니다'; if (ok) loadTags(); };
  $('btnTags').onclick = () => loadTags(true);
  $('appOrigin').textContent = location.origin + location.pathname;
  (async () => {
    try {
      const persisted = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false;
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
      $('storageInfo').textContent = (persisted ? '보호됨' : '보통') + (est && est.usage ? ` · ${(est.usage / 1048576).toFixed(1)}MB 씀` : '');
    } catch (e) { $('storageInfo').textContent = '-'; }
  })();

  // ---------- 시작 ----------
  (async () => {
    await renderList();
    await ping(); await loadTags();
    setInterval(async () => { const was = online; await ping(); if (!was && online) loadTags(); }, 20000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });
  })();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
